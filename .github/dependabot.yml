version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      media3:
        patterns:
          - "androidx.media3*"
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      detekt:
        patterns:
          - "io.gitlab.arturbosch.detekt*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
