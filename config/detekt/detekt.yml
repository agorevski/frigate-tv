# Extends detekt defaults (buildUponDefaultConfig = true in app/build.gradle.kts).
# Only deviations from defaults are listed here.

build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated:
      - 'Composable'
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    ignoreAnnotated:
      - 'Preview'

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    active: true
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
    ignorePropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreLocalVariableDeclaration: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 3
    excludeReturnFromLambda: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Preview'

formatting:
  active: true
  android: true
  # Compose call sites often put several short arguments on one line; these rules fight that style.
  ArgumentListWrapping:
    active: false
  PropertyWrapping:
    active: false
  MaximumLineLength:
    active: false
